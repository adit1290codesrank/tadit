[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nowcast"
version = "0.1.0"
description = "Multimodal (radar + satellite + lightning + NWP) thunderstorm and lightning nowcasting"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7",          # >=2.7 + cu128 wheels are required for RTX 5090 (sm_120)
    "numpy>=1.24",
    "zstandard>=0.22",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Only needed on the primary server to build shards.
data = [
    "pandas>=2",
    "h5py>=3.9",
    "s3fs>=2024.2",
    "pyproj>=3.6",
    "scipy>=1.11",
    "xarray>=2024.1",
    "herbie-data>=2024.3",
    "cfgrib>=0.9.11",
]
baselines = ["pysteps>=1.10"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
